<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>联机模拟人生 · Online Life Sim</title>
<style>
  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --card: rgba(255,255,255,0.06);
    --card2: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.12);
    --text: #eaeaf2;
    --dim: #9a9ab0;
    --accent: #ff6b9d;
    --accent2: #ffa751;
    --green: #4ade80;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 30px;
    background-attachment: fixed;
  }
  .hidden { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }

  /* ---------- 登录页 ---------- */
  #login { max-width: 460px; margin: 0 auto; padding: 20px; }
  .logo { text-align: center; margin: 36px 0 26px; }
  .logo .emoji { font-size: 64px; display: block; animation: float 3s ease-in-out infinite; }
  .logo h1 { font-size: 28px; margin-top: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo p { color: var(--dim); margin-top: 6px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; backdrop-filter: blur(8px); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .field input[type=text], .field input[type=password] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(0,0,0,0.3); color: var(--text); font-size: 16px; outline: none;
  }
  .field input[type=text]:focus, .field input[type=password]:focus { border-color: var(--accent); }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .auth-tab { flex: 1; padding: 11px; text-align: center; border-radius: 10px; background: rgba(0,0,0,.2); border: 1px solid var(--border); cursor: pointer; font-size: 15px; color: var(--dim); transition: all .15s; }
  .auth-tab.on { background: rgba(255,107,157,.15); border-color: var(--accent); color: var(--text); font-weight: 600; }

  .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; color: var(--dim); cursor: pointer; }
  .remember-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  .gender-row { display: flex; gap: 10px; }
  .gender-btn {
    flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(0,0,0,0.25); color: var(--text); font-size: 16px; cursor: pointer; text-align: center; transition: all .15s;
  }
  .gender-btn .g-emoji { display: block; font-size: 28px; margin-bottom: 4px; }
  .gender-btn.on { border-color: var(--accent); background: rgba(255,107,157,0.15); }
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 17px; font-weight: 600;
    cursor: pointer; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .5; }
  .auth-hint { text-align: center; margin-top: 12px; font-size: 12px; color: var(--dim); }

  /* ---------- 游戏页 ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .avatar { font-size: 52px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); animation: float 3s ease-in-out infinite; }
  .me-info { flex: 1; }
  .me-info .name { font-size: 20px; font-weight: 700; }
  .me-info .sub { font-size: 13px; color: var(--dim); margin-top: 3px; }
  .money-badge { background: rgba(251,191,36,.15); border: 1px solid rgba(251,191,36,.4); color: var(--yellow); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .money-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .music-btn { background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 4px; opacity: 1; transition: opacity .2s, filter .2s; }
  .music-btn.off { opacity: .25; filter: grayscale(1); }

  .stats { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .stat-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .stat-row .s-label { width: 44px; font-size: 13px; color: var(--dim); text-align: right; }
  .stat-row .bar { flex: 1; height: 14px; background: rgba(0,0,0,.3); border-radius: 8px; overflow: hidden; }
  .stat-row .fill { height: 100%; border-radius: 8px; transition: width .5s ease; }
  .stat-row .s-val { width: 34px; font-size: 12px; color: var(--dim); text-align: left; }

  .section-title { font-size: 13px; color: var(--dim); margin: 4px 0 10px; letter-spacing: 1px; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .act-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 6px;
    cursor: pointer; text-align: center; transition: all .15s; color: var(--text);
  }
  .act-btn:active { transform: scale(0.94); border-color: var(--accent); }
  .act-btn .a-emoji { font-size: 30px; display: block; margin-bottom: 6px; }
  .act-btn .a-name { font-size: 14px; font-weight: 600; }
  .act-btn .a-desc { font-size: 10px; color: var(--dim); margin-top: 3px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; padding: 11px; text-align: center; border-radius: 10px; background: var(--card); border: 1px solid var(--border); cursor: pointer; font-size: 14px; color: var(--dim); transition: all .15s; }
  .tab.on { background: rgba(255,107,157,.15); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .tab .badge { display: inline-block; background: var(--red); color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-left: 4px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; min-height: 120px; }
  .log-item { padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; line-height: 1.5; }
  .log-item .time { color: var(--dim); font-size: 11px; margin-right: 6px; }

  .player-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .player-item:last-child { border-bottom: none; }
  .p-avatar { font-size: 30px; }
  .p-info { flex: 1; }
  .p-info .p-name { font-size: 15px; font-weight: 600; }
  .p-info .p-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .p-actions { display: flex; gap: 6px; }
  .mini-btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); font-size: 12px; cursor: pointer; }
  .mini-btn.on { border-color: var(--accent); background: rgba(255,107,157,.15); }
  .mini-btn.accept { border-color: var(--green); color: var(--green); }
  .mini-btn.decline { border-color: var(--red); color: var(--red); }

  .rel-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .rel-item:last-child { border-bottom: none; }
  .rel-emoji { font-size: 26px; }

  .empty { text-align: center; color: var(--dim); padding: 24px 10px; font-size: 14px; }

  /* ---------- 聊天室 ---------- */
  #panelChat { display: flex; flex-direction: column; }
  .chat-box { flex: 1; height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .chat-msg { display: flex; flex-direction: column; align-items: flex-start; }
  .chat-msg.mine { align-items: flex-end; }
  .chat-msg .m-head { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .chat-msg .m-head .m-name { font-weight: 600; color: var(--accent2); }
  .chat-msg.mine .m-head .m-name { color: var(--accent); }
  .chat-msg .m-bubble { display: inline-block; max-width: 80%; background: rgba(0,0,0,.32); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: 14px; line-height: 1.45; word-break: break-word; }
  .chat-msg.mine .m-bubble { background: rgba(255,107,157,.18); border-color: rgba(255,107,157,.35); }
  .chat-msg .m-time { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .chat-sys { text-align: center; font-size: 11px; color: var(--dim); padding: 4px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .chat-input-row input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.3); color: var(--text); font-size: 15px; outline: none; }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-input-row .send-btn { padding: 0 18px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); cursor: pointer; }
  .chat-input-row .send-btn:active { transform: scale(0.95); }
  .chat-input-row .send-btn:disabled { opacity: .5; }

  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,.85); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .3s; max-width: 88%; text-align: center; z-index: 99; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 答题弹窗 ---------- */
  .quiz-mask { position: fixed; inset: 0; background: rgba(0,0,0,.68); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .quiz-card { background: #1e1e38; border: 1px solid var(--border); border-radius: 18px; padding: 22px; max-width: 460px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .quiz-subject { display: inline-block; background: rgba(96,165,250,.18); color: var(--blue); border: 1px solid rgba(96,165,250,.4); border-radius: 12px; padding: 4px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .quiz-question { font-size: 18px; line-height: 1.65; margin-bottom: 20px; font-weight: 600; word-break: break-word; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); font-size: 15px; cursor: pointer; transition: all .15s; line-height: 1.45; word-break: break-word; }
  .quiz-opt:active { transform: scale(0.98); border-color: var(--accent); background: rgba(255,107,157,.12); }

  /* ---------- PK 对战弹窗 ---------- */
  .pk-mask { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 210; padding: 16px; }
  .pk-card { background: #1e1e38; border: 1px solid var(--border); border-radius: 18px; padding: 20px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .pk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .pk-side { flex: 1; text-align: center; }
  .pk-score-tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin-bottom: 6px; }
  .pk-score-tag.dealer { background: rgba(251,191,36,.18); color: var(--yellow); border: 1px solid rgba(251,191,36,.4); }
  .pk-score-tag.follower { background: rgba(96,165,250,.18); color: var(--blue); border: 1px solid rgba(96,165,250,.4); }
  .pk-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .pk-score { font-size: 26px; font-weight: 800; color: var(--accent); }
  .pk-vs { font-size: 20px; font-weight: 800; color: var(--dim); }
  .pk-attr-row { text-align: center; font-size: 14px; color: var(--accent2); margin-bottom: 12px; min-height: 20px; }
  .pk-report-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .pk-report { flex: 1; background: rgba(0,0,0,.3); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .pk-report span { display: block; font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .pk-report b { font-size: 22px; color: var(--text); }
  .pk-log { max-height: 130px; overflow-y: auto; margin-bottom: 12px; background: rgba(0,0,0,.2); border-radius: 10px; padding: 8px 10px; }
  .pk-log-item { font-size: 12px; color: var(--dim); padding: 3px 0; line-height: 1.5; }
  .pk-actions { min-height: 40px; }
  .pk-hint { text-align: center; font-size: 13px; color: var(--dim); padding: 10px 4px; }
  .pk-attr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .pk-attr-btn { padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); font-size: 14px; cursor: pointer; transition: all .15s; }
  .pk-attr-btn:active { transform: scale(0.96); border-color: var(--accent); }
  .pk-attr-val { display: block; font-size: 20px; font-weight: 700; color: var(--accent2); margin-top: 2px; }
  .pk-input-row { margin-bottom: 10px; }
  .pk-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.3); color: var(--text); font-size: 20px; text-align: center; outline: none; }
  .pk-btn-row { display: flex; gap: 10px; }
  .pk-btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .pk-btn:active { transform: scale(0.96); }
  .pk-btn.danger { background: rgba(248,113,113,.25); border: 1px solid var(--red); color: var(--red); }
  .pk-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pk-result { text-align: center; font-size: 16px; font-weight: 700; padding: 14px; border-radius: 12px; margin-bottom: 10px; }
  .pk-result.win { background: rgba(74,222,128,.15); border: 1px solid var(--green); color: var(--green); }
  .pk-result.lose { background: rgba(248,113,113,.15); border: 1px solid var(--red); color: var(--red); }
  .pk-foot { margin-top: 12px; text-align: center; }
  .pk-quit { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; text-decoration: underline; }

  .dead-banner { background: rgba(248,113,113,.15); border: 1px solid var(--red); color: var(--red); border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 14px; font-size: 14px; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (max-width: 420px) {
    .actions { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .act-btn .a-emoji { font-size: 26px; }
    .act-btn .a-name { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login" class="wrap">
  <div class="logo">
    <span class="emoji">🌍</span>
    <h1>联机模拟人生</h1>
    <p>所有角色都是真人玩家 · 上学 · 工作 · 结缘</p>
  </div>
  <div class="card">
    <div class="auth-tabs">
      <div class="auth-tab on" id="tabLogin" onclick="switchAuth('login')">登录</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuth('register')">注册</div>
    </div>

    <!-- 登录表单 -->
    <div id="authLogin">
      <div class="field">
        <label>账号名</label>
        <input type="text" id="loginUser" placeholder="输入账号名" maxlength="20" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="输入密码" autocomplete="current-password">
      </div>
      <div class="remember-row" onclick="toggleRemember()">
        <input type="checkbox" id="rememberMe">
        <span>记住密码（下次自动登录）</span>
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">🚪 登录</button>
      <div class="auth-hint">还没有账号？点上方「注册」创建一个</div>
    </div>

    <!-- 注册表单 -->
    <div id="authRegister" class="hidden">
      <div class="field">
        <label>账号名</label>
        <input type="text" id="regUser" placeholder="输入账号名（3-20位）" maxlength="20" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="regPass" placeholder="输入密码（至少4位）" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="regPass2" placeholder="再输入一遍密码" autocomplete="new-password">
      </div>
      <div class="field">
        <label>选择性别</label>
        <div class="gender-row">
          <div class="gender-btn on" id="gMale" onclick="setGender('male')">
            <span class="g-emoji">👦</span>男
          </div>
          <div class="gender-btn" id="gFemale" onclick="setGender('female')">
            <span class="g-emoji">👧</span>女
          </div>
        </div>
      </div>
      <button class="btn" id="regBtn" onclick="doRegister()">🌱 注册并进入</button>
      <div class="auth-hint">已有账号？点上方「登录」</div>
    </div>
  </div>
  <div style="text-align:center;margin-top:14px;color:var(--dim);font-size:12px;" id="worldCount"></div>
</div>

<!-- 游戏页 -->
<div id="game" class="wrap hidden">
  <div class="topbar">
    <div class="avatar" id="avatar">👶</div>
    <div class="me-info">
      <div class="name" id="myName">玩家</div>
      <div class="sub" id="mySub">0岁 · 婴儿</div>
    </div>
    <div class="money-wrap">
      <button class="music-btn off" id="musicBtn" onclick="toggleMusic()" title="音乐开关">🎵</button>
      <div class="money-badge" id="myMoney">¥1000</div>
    </div>
  </div>

  <div class="dead-banner hidden" id="deadBanner">🌟 你已走完这一生。刷新页面可重新投胎开始新的人生。</div>

  <div class="stats" id="statsBox"></div>

  <div class="section-title">🕹️ 36 个行动长大 1 岁 · 精力每分钟恢复 10 点</div>
  <div class="actions" id="actionsBox"></div>

  <div class="tabs">
    <div class="tab on" onclick="switchTab('log', this)">📜 日志</div>
    <div class="tab" onclick="switchTab('world', this)">🌍 世界<span class="badge hidden" id="worldBadge"></span></div>
    <div class="tab" onclick="switchTab('rel', this)">💞 结缘<span class="badge hidden" id="relBadge"></span></div>
    <div class="tab" onclick="switchTab('chat', this)">💬 聊天</div>
  </div>

  <div class="panel" id="panelLog"></div>
  <div class="panel hidden" id="panelWorld"></div>
  <div class="panel hidden" id="panelRel"></div>
  <div class="panel hidden" id="panelChat">
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="和世界里的大家聊聊吧…" maxlength="200" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="send-btn" id="chatSendBtn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 答题弹窗 -->
<div id="quizModal" class="quiz-mask hidden">
  <div class="quiz-card">
    <div class="quiz-subject" id="quizSubject">数学</div>
    <div class="quiz-question" id="quizQuestion">题目</div>
    <div class="quiz-options" id="quizOptions"></div>
  </div>
</div>

<!-- PK 对战弹窗 -->
<div id="pkModal" class="pk-mask hidden">
  <div class="pk-card">
    <div class="pk-head">
      <div class="pk-side">
        <div class="pk-score-tag" id="pkMyTag">庄家</div>
        <div class="pk-name" id="pkMyName">我</div>
        <div class="pk-score" id="pkMyScore">0</div>
      </div>
      <div class="pk-vs">VS</div>
      <div class="pk-side">
        <div class="pk-score-tag" id="pkOppTag">后家</div>
        <div class="pk-name" id="pkOppName">对手</div>
        <div class="pk-score" id="pkOppScore">0</div>
      </div>
    </div>
    <div class="pk-attr-row" id="pkAttrRow"></div>
    <div class="pk-report-row">
      <div class="pk-report"><span>你的报点</span><b id="pkMyReport">—</b></div>
      <div class="pk-report"><span>对方报点</span><b id="pkOppReport">—</b></div>
    </div>
    <div class="pk-log" id="pkLog"></div>
    <div class="pk-actions" id="pkActions"></div>
    <div class="pk-foot"><button class="pk-quit" onclick="quitPk()">退出 PK</button></div>
  </div>
</div>

<!-- 私聊弹窗 -->
<div id="dmModal" class="pk-mask hidden">
  <div class="pk-card">
    <div class="pk-head">

}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// 精力随时间恢复：每 1 分钟 +10 点
function liveEnergy(p) {
  const base = p.energyAt || p.createdAt || Date.now();
  const elapsedMin = Math.floor((Date.now() - base) / 60000);
  return clamp((p.stats.energy || 0) + elapsedMin * ENERGY_PER_MIN, 0, 100);
}
function settleEnergy(p) {
  p.stats.energy = liveEnergy(p);

}

function milestoneEvents(p, oldAge, newAge) {

    [12, '升入初中 🎒'],

    [22, '进入社会，开启职场生涯 💼'],
    [60, '光荣退休，享受晚年 🌅'],
  ];
  for (const [a, msg] of ms) {
    if (oldAge < a && newAge >= a) addLog(p, msg);
  }
}

function applyAction(world, p, key, studyCorrect) {
  const act = ACTIONS_MAP[key];
  if (!act) return { ok: false, msg: '未知动作' };

  const s = p.stats;
  const oldAge = p.age;
  const before = { ...s };
  let energyCost = 0;
  const changes = [];

  // 结算精力恢复（基于上次行动以来的时间）
  settleEnergy(p);

  switch (key) {
    case 'study': {
      energyCost = 25;
      if (studyCorrect === true) {
        s.intel = clamp(s.intel + 1, 0, 100);
        changes.push('答对！智力+1');
      } else {
        changes.push('答错了，智力不变');
      }
      break;
    }
    case 'work': {
      energyCost = 30;
      if (p.age < 18) { addLog(p, '需年满 18 岁才能工作，先「学习」或「打工」吧'); return { ok: false, msg: '需年满 18 岁才能工作' }; }
      changeMoney(world, p, 100, '💼 工作收入 +¥100');
      changes.push('收入 +¥100');
      break;
    }
    case 'exercise':
      energyCost = 25;
      s.health = clamp(s.health + 8, 0, 100);
      s.charm = clamp(s.charm + 2, 0, 100);
      changes.push('健康+' + (s.health - before.health), '魅力+' + (s.charm - before.charm));
      break;
    case 'rest':
      // 休息 = 退出游戏，精力随时间恢复（不消耗精力、不成长年龄）
      return { ok: true, exit: true, msg: '😴 已退出游戏，精力会随时间恢复（每分钟+10点）' };
    case 'play':
      energyCost = 15;
      if (p.money < 100) { addLog(p, '金币不够，娱乐要花 100 金币'); return { ok: false, msg: '娱乐需要 100 金币，先去「打工」或「工作」赚金币吧' }; }
      changeMoney(world, p, -100, '🎮 娱乐花费 -¥100');

function myRelations(world, pid) {
  return world.relations

      const otherId = r.a === pid ? r.b : r.a;
      const otherP = world.players[otherId];
      return { id: r.id, type: r.type, typeName: REL_TYPES[r.type].name, typeEmoji: REL_TYPES[r.type].emoji, withName: otherP ? otherP.name : '已注销', withId: otherId };

}

// ---------- 金币共享（恋人/夫妻共同账户） ----------
// 返回当前玩家的共享金币搭档 id：配偶优先，其次第一个恋人
function sharedPartnerId(world, pid) {
  const rels = world.relations || [];
  const spouse = rels.find((r) => (r.a === pid || r.b === pid) && r.type === 'spouse');
  if (spouse) return spouse.a === pid ? spouse.b : spouse.a;
  const lover = rels.find((r) => (r.a === pid || r.b === pid) && r.type === 'lover');
  if (lover) return lover.a === pid ? lover.b : lover.a;
  return null;
}

// 统一金币变动：单人记账；若有共享搭档则同步对方并双方写日志
function changeMoney(world, p, delta, reason) {
  p.money = Math.max(0, (p.money || 0) + delta);
  const pid = sharedPartnerId(world, p.id);
  const partner = pid ? getPlayer(world, pid) : null;
  if (partner && partner.id !== p.id) {
    partner.money = p.money;
    addLog(p, reason + '（共同金币）');
    addLog(partner, '伴侣「' + p.name + '」' + reason + '（共同金币）');
  } else if (reason) {
    addLog(p, reason);
  }
}

// 建立恋人/结婚关系时合并金币为共同账户（双方均无共享搭档时才合并）
function linkSharedMoney(world, a, b, typeName) {
  if (sharedPartnerId(world, a.id) || sharedPartnerId(world, b.id)) return;
  const pool = (a.money || 0) + (b.money || 0);
  a.money = pool;
  b.money = pool;
  addLog(a, '与「' + b.name + '」成为' + typeName + '，金币合并为共同账户 ¥' + pool.toLocaleString() + ' 💰');
  addLog(b, '与「' + a.name + '」成为' + typeName + '，金币合并为共同账户 ¥' + pool.toLocaleString() + ' 💰');
}

function isRelationBetween(rels, a, b, type) {
  return rels.some((r) => ((r.a === a && r.b === b) || (r.a === b && r.b === a)) && r.type === type);
}
function hasSpouse(rels, pid) {
  return rels.some((r) => (r.a === pid || r.b === pid) && r.type === 'spouse');
}
function canRequestSpouse(aId, bId) {
  const a = worldPlayers[aId], b = worldPlayers[bId];
  if (!a || !b) return false;
  if (!isRelationBetween(worldRel, aId, bId, 'lover')) return false;
  if ((a.stats.charm || 0) < 60 || (b.stats.charm || 0) < 60) return false;
  if (hasSpouse(worldRel, aId) || hasSpouse(worldRel, bId)) return false;
  return true;
}

// ---------- Supabase 读写 ----------
async function loadWorld() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/game_state?id=eq.1&select=world', { headers: SB_HEADERS });
    if (r.ok) {
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length > 0 && rows[0].world) {
        return normalizeWorld(rows[0].world);
      }
    }
  } catch (e) { console.error('[存档] 加载失败', e); }
  return emptyWorld();
}

async function saveWorld(world) {
  try {
    await fetch(SB_URL + '/rest/v1/game_state?id=eq.1', {
      method: 'PATCH',
      headers: { ...SB_HEADERS, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ world }),
    });
  } catch (e) { console.error('[存档] 保存失败', e); }
}

// ---------- 写锁（同一客户端串行化写操作） ----------
let writeQueue = Promise.resolve();
function withLock(fn) {
  const p = writeQueue.then(fn);
  writeQueue = p.catch(() => {});
  return p;
}

// 登录
async function doLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  if (!username) { toast('请输入账号名'); return; }
  if (!password) { toast('请输入密码'); return; }
  const btn = $('loginBtn');

  try {

    enterGame();

    console.error(e);

// 注册
async function doRegister() {
  const username = $('regUser').value.trim();
  const password = $('regPass').value;
  const password2 = $('regPass2').value;
  if (username.length < 3) { toast('账号名至少 3 个字符'); return; }
  if (password.length < 4) { toast('密码至少 4 位'); return; }
  if (password !== password2) { toast('两次输入的密码不一致'); return; }
  const btn = $('regBtn');
  btn.disabled = true;
  try {
    const result = await withLock(async () => {
      const world = await loadWorld();
      const exists = Object.values(world.players).some(x => x.username === username);
      if (exists) return { ok: false, msg: '账号名已被注册，换一个吧' };
      const hash = await sha256(password);
      const p = newPlayer(world, username, gender, hash);
      world.players[p.id] = p;
      addLog(p, '来到这个世界 👋');
      await saveWorld(world);
      return { ok: true, player: publicPlayer(p), id: p.id };
    });
    if (!result.ok) { toast(result.msg || '注册失败'); btn.disabled = false; return; }
    myId = result.id;
    localStorage.setItem('lifeSimPlayerId', myId);
    if ($('rememberMe').checked) rememberAccount(username, password);
    enterGame();
  } catch (e) {
    console.error(e);
    toast('网络错误，请重试');
  }
  btn.disabled = false;
}

// 自动登录（记住密码后，下次自动填账号密码并尝试登录）
async function tryAutoLogin() {
  const saved = localStorage.getItem('lifeSimAccount');
  if (!saved) return;
  try {
    const { username, password } = JSON.parse(saved);
    if (!username || !password) return;
    $('loginUser').value = username;
    $('loginPass').value = password;
    $('rememberMe').checked = true;
    // 直接尝试登录
    const world = await loadWorld();
    const hash = await sha256(password);
    const p = Object.values(world.players).find(x => x.username === username && x.passwordHash === hash);
    if (p) {
      myId = p.id;
      localStorage.setItem('lifeSimPlayerId', myId);
      enterGame();
    }
  } catch (e) {}
}

  $('mySub').textContent = me.age + '岁 · ' + me.stage + ' · ' + (me.gender === 'female' ? '女' : '男') + ' · 行动 ' + prog + '/' + ACTIONS_PER_YEAR;
  $('myMoney').textContent = '¥' + me.money.toLocaleString();
  $('deadBanner').classList.toggle('hidden', me.alive !== false);

  let html = '';
  for (const s of STAT_DEFS) {
    let v = me.stats[s.key] || 0;
    if (s.key === 'energy' && d.liveEnergy != null) v = d.liveEnergy;
    html += '<div class="stat-row"><span class="s-label">' + s.label + '</span>' +
      '<div class="bar"><div class="fill" style="width:' + v + '%;background:' + s.color + '"></div></div>' +
      '<span class="s-val">' + fmtVal(v) + '</span></div>';
  }
  $('statsBox').innerHTML = html;

  if (currentTab === 'log') renderLog(d.log || []);
  renderRel(d.relations || [], d.incoming || []);
  $('relBadge').classList.toggle('hidden', !(d.incoming || []).length);
  $('relBadge').textContent = (d.incoming || []).length;

function renderLog(log) {

}

function renderWorld() {

function renderRel(relations, incoming) {

    html += '<div class="section-title">📥 收到的结缘请求</div>';

        '<div class="p-actions"><button class="mini-btn accept" onclick="respond(\'' + r.id + '\',true)">接受</button>' +

// ---------- 数据刷新 ----------
async function refreshMe() {
  if (!myId) return;
  try {
    const world = await loadWorld();
    const p = getPlayer(world, myId);
    if (!p) { return; }
    const incoming = world.requests
      .filter((r) => r.to === myId && r.status === 'pending')
      .map((r) => ({ id: r.id, from: r.from, fromName: (getPlayer(world, r.from) || {}).name || '未知', type: r.type, typeName: REL_TYPES[r.type].name, typeEmoji: REL_TYPES[r.type].emoji }));
    renderMe({ player: publicPlayer(p), liveEnergy: liveEnergy(p), log: p.log.slice(0, 20), relations: myRelations(world, myId), incoming });
  } catch (e) {}
}

async function refreshWorld() {
  try {
    const world = await loadWorld();
    worldRel = world.relations || [];
    worldPlayers = world.players || {};
    worldList = Object.values(world.players).map(publicPlayer).sort((a, b) => b.lastActive - a.lastActive);
    renderWorld();
    $('worldCount').textContent = '当前世界有 ' + worldList.length + ' 位玩家';
  } catch (e) {}
}

// ---------- 行动 ----------
async function doAction(key) {
  if (!myId) return;
  if (key === 'study') { startStudy(); return; }
  if (key === 'play') { startPk(); return; }
  if (key === 'social') { goChat(); return; }
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      if (!p) return { ok: false, msg: '角色不存在' };
      const r = applyAction(world, p, key);
      if (r.ok) await saveWorld(world);
      return { ok: r.ok, exit: r.exit, msg: r.msg, eventText: r.eventText, player: publicPlayer(p), liveEnergy: liveEnergy(p), log: p.log.slice(0, 20) };
    });
    if (d.exit) {
      toast(d.msg);
      logout();
      return;
    }
    if (d.ok) {
      toast(d.eventText || d.msg);
      renderMe({ player: d.player, liveEnergy: d.liveEnergy, log: d.log, relations: me ? me.relations : [], incoming: [] });
      refreshWorld();
    } else {
      toast(d.msg || '操作失败');
    }
  } catch (e) { toast('网络错误'); }
}

// ---------- 学习：答题 ----------
let pendingStudy = null;
const SUBJECT_NAMES = { math: '数学', english: '英语', physics: '物理', chemistry: '化学', biology: '生物' };

function startStudy() {
  if (!myId) return;
  if (typeof QUESTIONS === 'undefined' || !QUESTIONS.length) { toast('题库加载失败，请刷新页面'); return; }
  (async () => {
    try {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      if (!p) { toast('角色不存在'); return; }
      if (p.alive === false) { toast('已故，无法学习'); return; }
      settleEnergy(p);
      if (p.stats.energy < 25) { toast('精力不足（' + p.stats.energy + '/100），休息或等几分钟再学习'); return; }
      const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
      pendingStudy = q;
      showStudyModal(q);
    } catch (e) { toast('网络错误'); }
  })();
}

function showStudyModal(q) {
  $('quizSubject').textContent = SUBJECT_NAMES[q.s] || '综合';
  $('quizQuestion').textContent = q.q;
  const opts = $('quizOptions');
  opts.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt;
    btn.onclick = () => submitStudy(i);
    opts.appendChild(btn);
  });
  $('quizModal').classList.remove('hidden');
}

async function submitStudy(choiceIdx) {
  if (!myId || !pendingStudy) return;
  const q = pendingStudy;
  pendingStudy = null;
  const correct = (choiceIdx === q.a);
  $('quizModal').classList.add('hidden');
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      if (!p) return { ok: false, msg: '角色不存在' };
      const r = applyAction(world, p, 'study', correct);
      if (r.ok) await saveWorld(world);
      return { ok: r.ok, msg: r.msg, eventText: r.eventText, player: publicPlayer(p), liveEnergy: liveEnergy(p), log: p.log.slice(0, 20), correct };
    });
    if (d.ok) {
      toast((d.correct ? '✅ 答对了！智力+1' : '❌ 答错了，智力不变') + (d.eventText ? '，' + d.eventText : ''));
      renderMe({ player: d.player, liveEnergy: d.liveEnergy, log: d.log, relations: me ? me.relations : [], incoming: (me && me.incoming) || [] });
      refreshWorld();
    } else {
      toast(d.msg || '操作失败');
    }
  } catch (e) { toast('网络错误'); }
}

// ---------- 结缘 ----------
async function sendRelation(targetId, type) {
  if (!myId) return;
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      const t = getPlayer(world, targetId);
      if (!p || !t) return { ok: false, msg: '对方不存在' };
      if (myId === targetId) return { ok: false, msg: '不能和自己结缘' };
      if (!REL_TYPES[type]) return { ok: false, msg: '关系类型错误' };
      const exists = world.relations.find((r) => ((r.a === myId && r.b === targetId) || (r.a === targetId && r.b === myId)) && r.type === type);
      if (exists) return { ok: false, msg: '你们已经是' + REL_TYPES[type].name + '了' };
      if (type === 'spouse') {
        const isLover = world.relations.some((r) => ((r.a === myId && r.b === targetId) || (r.a === targetId && r.b === myId)) && r.type === 'lover');
        if (!isLover) return { ok: false, msg: '需先成为恋人才能申请结婚 💕' };
        if ((p.stats.charm || 0) < 60 || (t.stats.charm || 0) < 60) return { ok: false, msg: '双方魅力都需达到 60 才能申请结婚' };
        if (world.relations.some((r) => (r.a === myId || r.b === myId) && r.type === 'spouse') ||
            world.relations.some((r) => (r.a === targetId || r.b === targetId) && r.type === 'spouse')) {
          return { ok: false, msg: '已婚者不能再次申请结婚 💍' };
        }
      }
      const pend = world.requests.find((r) => r.from === myId && r.to === targetId && r.type === type && r.status === 'pending');
      if (pend) return { ok: false, msg: '已发送过请求，等待对方回应' };
      world.requests.push({ id: 'r' + (++world.seq) + '_' + randHex(3), from: myId, to: targetId, type: type, status: 'pending', createdAt: Date.now() });
      addLog(p, '向「' + t.name + '」发送了' + REL_TYPES[type].name + '请求 ' + REL_TYPES[type].emoji);
      await saveWorld(world);
      return { ok: true, msg: '已向 ' + t.name + ' 发送' + REL_TYPES[type].name + '请求 ' + REL_TYPES[type].emoji };
    });
    toast(d.msg || (d.ok ? '已发送' : '操作失败'));
    if (d.ok) refreshMe();
  } catch (e) { toast('网络错误'); }
}

async function respond(requestId, accept) {
  if (!myId) return;
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      const rq = world.requests.find((r) => r.id === requestId);
      if (!p || !rq) return { ok: false, msg: '请求不存在' };
      if (rq.to !== myId) return { ok: false, msg: '无权处理' };
      if (rq.status !== 'pending') return { ok: false, msg: '请求已处理' };
      const from = getPlayer(world, rq.from);
      if (accept) {
        rq.status = 'accepted';
        if (from && (rq.type === 'lover' || rq.type === 'spouse')) {
          linkSharedMoney(world, from, p, REL_TYPES[rq.type].name);
        }
        world.relations.push({ id: 'rel' + (++world.seq), a: rq.from, b: rq.to, type: rq.type, createdAt: Date.now() });
        if (from) { from.stats.happy = clamp(from.stats.happy + 10, 0, 100); from.stats.charm = clamp(from.stats.charm + 10, 0, 100); addLog(from, '和「' + p.name + '」结为' + REL_TYPES[rq.type].name + ' 🎉'); }
        p.stats.happy = clamp(p.stats.happy + 10, 0, 100);
        p.stats.charm = clamp(p.stats.charm + 10, 0, 100);
        addLog(p, '和「' + (from ? from.name : '未知') + '」结为' + REL_TYPES[rq.type].name + ' 🎉');
        await saveWorld(world);
        return { ok: true, msg: '你们结为' + REL_TYPES[rq.type].name + '了！' };
      } else {
        rq.status = 'declined';
        await saveWorld(world);
        return { ok: true, msg: '已拒绝该请求' };
      }
    });
    toast(d.msg || '已处理');
    refreshMe();
  } catch (e) { toast('网络错误'); }
}

// ---------- 聊天室 ----------
function fmtTime(t) {
  const d = new Date(t);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderChat(messages, append) {
  const box = $('chatBox');
  if (!append) {
    box.innerHTML = '';
    if (!messages.length) { box.innerHTML = '<div class="chat-sys">聊天室还很安静，说句话吧 👋</div>'; return; }
  }
  for (const m of messages) {
    const isMine = m.from === myId;
    const el = document.createElement('div');
    el.className = 'chat-msg' + (isMine ? ' mine' : '');
    el.innerHTML = '<div class="m-head"><span class="m-name">' + esc(m.fromName) + '</span></div>' +
      '<div class="m-bubble">' + esc(m.text) + '</div>' +
      '<div class="m-time">' + fmtTime(m.t) + '</div>';
    box.appendChild(el);
  }
  while (box.children.length > 120) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

async function refreshChat() {
  if (!myId) return;
  try {
    const world = await loadWorld();
    const after = chatLast;
    const msgs = (world.chat || []).filter((m) => m.t > after);
    if (msgs.length) {
      renderChat(msgs.slice(-100), chatLoaded);
      if (msgs.length) chatLast = msgs[msgs.length - 1].t;
    } else if (!chatLoaded) {
      renderChat([], false);
    }
    chatLoaded = true;
  } catch (e) {}
}

async function sendChat() {
  if (!myId) return;
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const btn = $('chatSendBtn');
  btn.disabled = true;
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      if (!p) return { ok: false, msg: '角色不存在' };
      if (p.alive === false) return { ok: false, msg: '已故，无法聊天' };
      const content = String(text).slice(0, 200);
      if (!world.chat) world.chat = [];
      world.chat.push({ id: 'm' + (++world.seq) + '_' + randHex(2), from: myId, fromName: p.name, text: content, t: Date.now() });
      if (world.chat.length > MAX_CHAT) world.chat = world.chat.slice(-MAX_CHAT);
      p.stats.charm = clamp(p.stats.charm + 0.5, 0, 100);
      await saveWorld(world);
      return { ok: true };
    });
    if (d.ok) { input.value = ''; refreshChat(); refreshMe(); }
    else { toast(d.msg || '发送失败'); }
  } catch (e) { toast('网络错误'); }
  btn.disabled = false;
}

// ---------- 社交：打开聊天 ----------
async function goChat() {
  if (!myId) return;
  try {
    const d = await withLock(async () => {
      const world = await loadWorld();
      const p = getPlayer(world, myId);
      if (!p) return { ok: false, msg: '角色不存在' };
      if (p.money < SOCIAL_COST) return { ok: false, msg: '金币不够，社交需要 ' + SOCIAL_COST + ' 金币，先去打工或工作赚金币吧' };
      changeMoney(world, p, -SOCIAL_COST, '💬 社交花费 -¥' + SOCIAL_COST);
      await saveWorld(world);
      return { ok: true };
    });
    if (!d.ok) { toast(d.msg || '社交失败'); return; }
    const tabs = document.querySelectorAll('.tab');
    for (const t of tabs) { if (t.textContent.indexOf('聊天') >= 0) { switchTab('chat', t); break; } }
    toast('💬 已花 ' + SOCIAL_COST + ' 金币，发言 +0.5 魅力，结缘后可私聊（私聊 +1 魅力）');
    refreshMe();
  } catch (e) { toast('网络错误'); }
}

// ---------- 私聊 ----------
function isDmBetween(m, a, b) {
  return (m.from === a && m.to === b) || (m.from === b && m.to === a);
}

async function openDm(peerId) {

function closeDm() {

// ---------- Tab 切换 ----------
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  $('panelLog').classList.toggle('hidden', tab !== 'log');
  $('panelWorld').classList.toggle('hidden', tab !== 'world');
  $('panelRel').classList.toggle('hidden', tab !== 'rel');
  $('panelChat').classList.toggle('hidden', tab !== 'chat');
  if (tab === 'world') renderWorld();
  if (tab === 'rel' && me) renderRel(me.relations || [], me.incoming || []);
  if (tab === 'log' && me) refreshMe();
  if (tab === 'chat') { refreshChat(); const b = $('chatBox'); b.scrollTop = b.scrollHeight; }
}

// ---------- 初始化 ----------
function init() {
  let html = '';
  for (const a of ACTIONS) {
    html += '<div class="act-btn" onclick="doAction(\'' + a.key + '\')">' +
      '<span class="a-emoji">' + a.emoji + '</span><div class="a-name">' + a.name + '</div>' +
      '<div class="a-desc">' + a.desc + '</div></div>';
  }
  $('actionsBox').innerHTML = html;

  refreshWorld();

  bootstrap();
}

// 校验存档 id 是否仍有效（世界可能被重置、角色可能被清除）
async function bootstrap() {
  if (myId) {
    try {
      const world = await loadWorld();
      if (!getPlayer(world, myId)) {
        // 角色已不存在，清除失效的存档 id，回到登录/自动登录
        myId = null;
        localStorage.removeItem('lifeSimPlayerId');
      }
    } catch (e) {}
  }
  if (myId) {
    enterGame();
  } else {
    tryAutoLogin();
  }
}
init();
</script>
